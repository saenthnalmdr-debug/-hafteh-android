
name: Build Hafteh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check source ZIP
        run: |
          test -f HaftehAndroid-source-rebuilt.zip

      - name: Extract Android source
        run: |
          mkdir -p HaftehAndroid
          unzip -oq HaftehAndroid-source-rebuilt.zip -d HaftehAndroid

          test -f HaftehAndroid/settings.gradle.kts
          test -f HaftehAndroid/build.gradle.kts
          test -f HaftehAndroid/app/build.gradle.kts
          test -f HaftehAndroid/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          gradle -p HaftehAndroid \
            --no-daemon \
            assembleDebug

      - name: Verify APK
        run: |
          APK="HaftehAndroid/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafteh-debug-APK
          path: HaftehAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
