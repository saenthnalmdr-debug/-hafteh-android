
name: Build Hafteh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: unzip -q HaftehAndroid-source.zip
             - name: Update Android Gradle Plugin
        run: |
          find HaftehAndroid -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "libs.versions.toml" \) -exec sed -i 's/9\.0\.0/9.1.0/g' {} +

      - name: Build debug APK
        run: gradle -p HaftehAndroid --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafteh-debug-APK
          path: HaftehAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
